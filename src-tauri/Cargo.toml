[package]
name = "cluent"
version = "0.1.2"
description = "Cluent — offline SSH client"
edition = "2021"
publish = false

[lib]
name = "cluent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# No telemetry, crash reporters or updaters: the only network traffic is the SSH you start.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
